<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
	@font-face {
		font-family: 'SangBleu Sunrise';
		src: url('../../static/fonts/SangBleuSunrise-Regular-WebXL.woff2') format('woff2');
		font-weight: 400;
	}
	@font-face {
		font-family: 'SangBleu Sunrise';
		src: url('../../static/fonts/SangBleuSunrise-Light-WebXL.woff2') format('woff2');
		font-weight: 300;
	}
	@font-face {
		font-family: 'SangBleu Sunrise';
		src: url('../../static/fonts/SangBleuSunrise-Bold-WebXL.woff2') format('woff2');
		font-weight: 700;
	}
	* { margin: 0; padding: 0; box-sizing: border-box; }
	body {
		width: 1200px;
		height: 630px;
		background: #f4f3ee;
		font-family: 'SangBleu Sunrise', serif;
		color: #17170f;
		position: relative;
		overflow: hidden;
	}
	.card {
		position: absolute;
		inset: 0;
		padding: 72px 84px 56px;
		display: flex;
		flex-direction: column;
	}
	.wordmark {
		font-size: 40px;
		font-weight: 700;
		letter-spacing: 0.06em;
	}
	.headline {
		margin-top: auto;
		font-size: 88px;
		font-weight: 400;
		line-height: 1.12;
		letter-spacing: -0.01em;
		max-width: 900px;
	}
	.subline {
		margin-top: 26px;
		font-size: 31px;
		font-weight: 300;
		line-height: 1.35;
		color: #4a493f;
		max-width: 820px;
	}
	.place {
		margin-top: 40px;
		display: flex;
		align-items: center;
		gap: 10px;
		font-family: ui-monospace, 'SF Mono', Menlo, monospace;
		font-size: 19px;
		font-weight: 600;
		letter-spacing: 0.08em;
	}
	.dot {
		width: 12px;
		height: 12px;
		border-radius: 50%;
		background: #3f9e58;
	}
	.rule {
		position: absolute;
		top: 80px;
		bottom: 80px;
		right: 78px;
		width: 1px;
		background: #c9c8bf;
	}
</style>
</head>
<body>
	<div class="card">
		<div class="wordmark">DYAD</div>
		<h1 class="headline">Turn your conversations online, offline.</h1>
		<p class="subline">A third space for initiating and finding face to face conversations about what matters to you.</p>
		<div class="place"><span class="dot"></span>BERLIN</div>
	</div>
	<div class="rule"></div>
</body>
</html>
